<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101828">
  <title>Mini‑GPT</title>
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="orb" aria-hidden="true"></div>
      <div><h1>Mini‑GPT</h1><p id="status">آماده • حافظه محلی</p></div>
      <label class="switch"><input id="web-toggle" type="checkbox" checked><span>وب</span></label>
    </header>
    <section id="messages" class="messages" aria-live="polite">
      <article class="message assistant">سلام امین. آنلاین باشم جست‌وجو می‌کنم؛ آفلاین باشم از دانش و حافظه محلی جواب می‌دهم.</article>
    </section>
    <form id="chat-form">
      <textarea id="prompt" rows="1" placeholder="پیامت را بنویس…" required></textarea>
      <button type="submit" aria-label="ارسال">↑</button>
    </form>
  </main>
  <script src="/static/app.js" defer></script>
</body>
</html>
