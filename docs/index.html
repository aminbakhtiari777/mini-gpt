<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#070b16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zamis">
  <title>Zamis • Private iPad AI</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <link rel="stylesheet" href="./styles.css?v=13">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <div class="identity">
        <div class="orb" aria-hidden="true"></div>
        <div><h1>Zamis</h1><p id="status">Your private AI assistant</p></div>
      </div>
      <div class="topbar-controls">
        <label class="pill-switch"><input id="speak-toggle" type="checkbox" checked><span>Voice</span></label>
        <label class="pill-switch"><input id="web-toggle" type="checkbox" checked><span>Web</span></label>
      </div>
    </header>
    <section id="setup" class="setup-card">
      <span class="eyebrow">PRIVATE • ON DEVICE</span>
      <h2>Zamis runs on this iPad</h2>
      <p>Download the model once and chat privately without a server.</p>
      <button id="load-model" type="button">Download AI model • ~2.5 GB</button>
      <div class="progress-track"><div id="progress-bar" class="progress-bar"></div></div>
      <small id="progress-label">Keep Safari open during first download.</small>
    </section>
    <section id="messages" class="messages" aria-live="polite"><article class="message assistant" dir="auto">سلام امین، من زمیس هستم. آماده‌ام کمک کنم.</article></section>
    <form id="chat-form" class="composer">
      <textarea id="prompt" rows="1" dir="auto" placeholder="پیامت را بنویس یا با میکروفون بگو…" disabled required></textarea>
      <div class="composer-actions">
        <select id="speech-language" aria-label="Voice input language">
          <option value="auto">Auto</option>
          <option value="fa-IR">فارسی</option>
          <option value="en-US">English</option>
        </select>
        <button id="microphone" class="microphone" type="button" aria-label="Start voice input" disabled>●</button>
        <button id="send" type="submit" aria-label="Send message" disabled>↑</button>
      </div>
    </form>
    <footer><button id="clear-chat" class="text-button" type="button">Clear chat</button><span id="app-mode">Local model • Local memory</span></footer>
  </main>
  <script type="module" src="./app.js?v=13"></script>
</body>
</html>
